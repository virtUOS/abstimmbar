# SPDX-License-Identifier: Apache-2.0
# Pull-request and branch pipeline (successor of .gitlab-ci.yml): backend lint,
# backend tests against PostgreSQL 16 (as in production), frontend type-check
# + build, and a dependency review that fails on newly added vulnerable
# packages. Required for merging into main and release/* (branch protection).
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/*"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install --quiet ruff
      - run: cd backend && ruff check .

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: abstimmbar
          POSTGRES_USER: abstimmbar
          POSTGRES_PASSWORD: abstimmbar
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U abstimmbar" --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      POSTGRES_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install --quiet -r backend/requirements.txt
      # Pure Python (Babel from PyPI) instead of apt-get gettext: an Ubuntu
      # mirror outage on the runners (Nov 2026) blocked every pipeline.
      - name: Translation catalog is compiled
        run: |
          pip install --quiet babel==2.17.0
          cd backend && python scripts/check_compiled_catalog.py
      - run: cd backend && python manage.py makemigrations --check --dry-run
      - run: cd backend && python manage.py test --noinput --parallel 4

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: cd frontend && npm ci --no-fund --no-audit
      - run: cd frontend && npm run build

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: moderate
